name: Test
on: [push, pull_request]
jobs:
  unit-integration:
    strategy: { matrix: { os: [ubuntu-latest, macos-26] } }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.x' }
      - run: go test -race ./...
      - run: go vet ./...
