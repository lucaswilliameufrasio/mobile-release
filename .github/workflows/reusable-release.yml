name: Reusable Mobile Release

# Called by app repositories:
#
#   jobs:
#     release:
#       uses: lucaswilliameufrasio/mobile-release/.github/workflows/reusable-release.yml@<tag>
#       with: { command: deploy, environment: staging, platform: android, runner: ubuntu-latest }
#       secrets: inherit
#
# Linux runners can release Android; iOS (or platform "all") needs macOS.

on:
  workflow_call:
    inputs:
      command: { required: false, type: string, default: deploy, description: "deploy or qa" }
      environment: { required: false, type: string, default: "", description: "environment from release.toml" }
      platform: { required: false, type: string, default: all }
      runner: { required: false, type: string, default: macos-26 }
      mobile-release-version: { required: false, type: string, default: latest }
      flutter-version-file: { required: false, type: string, default: "", description: "e.g. .fvmrc or pubspec.yaml; empty skips Flutter" }
      node-version: { required: false, type: string, default: "", description: "empty skips Node.js" }
      java-version: { required: false, type: string, default: "21" }
      release-notes: { required: false, type: string, default: "" }
    secrets:
      MOBILE_RELEASE_ANDROID_KEYSTORE_BASE64: { required: false }
      MOBILE_RELEASE_ANDROID_KEYSTORE_PASSWORD: { required: false }
      MOBILE_RELEASE_ANDROID_KEY_ALIAS: { required: false }
      MOBILE_RELEASE_ANDROID_KEY_PASSWORD: { required: false }
      MOBILE_RELEASE_GOOGLE_PLAY_JSON_BASE64: { required: false }
      MOBILE_RELEASE_FIREBASE_SERVICE_ACCOUNT_BASE64: { required: false }
      MOBILE_RELEASE_APP_STORE_KEY_ID: { required: false }
      MOBILE_RELEASE_APP_STORE_ISSUER_ID: { required: false }
      MOBILE_RELEASE_APP_STORE_PRIVATE_KEY_BASE64: { required: false }
      MOBILE_RELEASE_MATCH_GIT_URL: { required: false }
      MOBILE_RELEASE_MATCH_PASSWORD: { required: false }
      MOBILE_RELEASE_MATCH_SSH_KEY: { required: false }
      MOBILE_RELEASE_EXPO_TOKEN: { required: false }

permissions:
  contents: read

jobs:
  release:
    runs-on: ${{ inputs.runner }}
    concurrency:
      group: mobile-release-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      MOBILE_RELEASE_ANDROID_KEYSTORE_BASE64: ${{ secrets.MOBILE_RELEASE_ANDROID_KEYSTORE_BASE64 }}
      MOBILE_RELEASE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MOBILE_RELEASE_ANDROID_KEYSTORE_PASSWORD }}
      MOBILE_RELEASE_ANDROID_KEY_ALIAS: ${{ secrets.MOBILE_RELEASE_ANDROID_KEY_ALIAS }}
      MOBILE_RELEASE_ANDROID_KEY_PASSWORD: ${{ secrets.MOBILE_RELEASE_ANDROID_KEY_PASSWORD }}
      MOBILE_RELEASE_GOOGLE_PLAY_JSON_BASE64: ${{ secrets.MOBILE_RELEASE_GOOGLE_PLAY_JSON_BASE64 }}
      MOBILE_RELEASE_FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.MOBILE_RELEASE_FIREBASE_SERVICE_ACCOUNT_BASE64 }}
      MOBILE_RELEASE_APP_STORE_KEY_ID: ${{ secrets.MOBILE_RELEASE_APP_STORE_KEY_ID }}
      MOBILE_RELEASE_APP_STORE_ISSUER_ID: ${{ secrets.MOBILE_RELEASE_APP_STORE_ISSUER_ID }}
      MOBILE_RELEASE_APP_STORE_PRIVATE_KEY_BASE64: ${{ secrets.MOBILE_RELEASE_APP_STORE_PRIVATE_KEY_BASE64 }}
      MOBILE_RELEASE_MATCH_GIT_URL: ${{ secrets.MOBILE_RELEASE_MATCH_GIT_URL }}
      MOBILE_RELEASE_MATCH_PASSWORD: ${{ secrets.MOBILE_RELEASE_MATCH_PASSWORD }}
      MOBILE_RELEASE_EXPO_TOKEN: ${{ secrets.MOBILE_RELEASE_EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.4.12'

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: inputs.java-version != ''
        with:
          distribution: corretto
          java-version: ${{ inputs.java-version }}

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: inputs.flutter-version-file != ''
        with:
          channel: stable
          flutter-version-file: ${{ inputs.flutter-version-file }}
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.node-version != ''
        with:
          node-version: ${{ inputs.node-version }}

      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        if: env.MOBILE_RELEASE_MATCH_GIT_URL != ''
        with:
          ssh-private-key: ${{ secrets.MOBILE_RELEASE_MATCH_SSH_KEY }}

      - name: Install mobile-release
        env:
          VERSION: ${{ inputs.mobile-release-version }}
        run: go install "github.com/lucaswilliameufrasio/mobile-release/v2/cmd/mobile-release@${VERSION}"

      - name: Run mobile-release
        env:
          COMMAND: ${{ inputs.command }}
          ENVIRONMENT: ${{ inputs.environment }}
          PLATFORM: ${{ inputs.platform }}
          NOTES: ${{ inputs.release-notes }}
        run: |
          args=("$COMMAND" -yes -platform "$PLATFORM")
          if [ -n "$ENVIRONMENT" ]; then args+=(-env "$ENVIRONMENT"); fi
          if [ -n "$NOTES" ] && [ "$COMMAND" = deploy ]; then args+=(-notes "$NOTES"); fi
          mobile-release "${args[@]}"
