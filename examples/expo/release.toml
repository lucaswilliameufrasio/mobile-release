schema_version = 2

[project]
type = "expo"

[app]
name = "Example Expo"

[android]
package_name = "com.example.expo"

[ios]
bundle_id = "com.example.expo"
# Generated by `expo prebuild`; found automatically when omitted.
workspace = "ios/ExampleExpo.xcworkspace"
scheme = "ExampleExpo"

# EXPO_PUBLIC_* values from env_file are inlined at build time.
[environments.preview]
env_file = ".env.preview"
destinations = ["firebase", "ota"]

[environments.preview.firebase]
android_app_id = "1:000000000000:android:0000000000000000"
ios_app_id = "1:000000000000:ios:0000000000000000"

[environments.preview.ota]
mode = "eas"
channel = "preview"

[environments.production]
env_file = ".env.production"
build_number = "store"
destinations = ["play", "testflight", "ota"]

# Self-hosted Expo Updates server: export the bundle and run your upload
# command, which receives MOBILE_RELEASE_OTA_DIR and MOBILE_RELEASE_OTA_CHANNEL.
[environments.production.ota]
mode = "command"
channel = "production"
command = "./scripts/publish-update.sh"
