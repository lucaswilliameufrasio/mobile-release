name: Mobile Release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment from release.toml
        type: string
        required: true
      platform:
        type: choice
        options: [all, android, ios]
        default: all

permissions:
  contents: read

jobs:
  release:
    uses: lucaswilliameufrasio/mobile-release/.github/workflows/reusable-release.yml@v2.0.1
    with:
      command: deploy
      environment: ${{ inputs.environment }}
      platform: ${{ inputs.platform }}
      # Android-only releases can run on ubuntu-latest.
      runner: macos-26
      flutter-version-file: pubspec.yaml
    secrets: inherit
