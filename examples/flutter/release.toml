schema_version = 2

[project]
type = "flutter"

[app]
name = "Example Flutter"

[android]
package_name = "com.example.flutter"

[ios]
bundle_id = "com.example.flutter"
team_id = "ABCDE12345"
signing = "match"

# Testers: APK + ad-hoc IPA on Firebase App Distribution.
[environments.staging]
env_file = ".env"
defines = { APP_COMMIT = "{commit}" }
destinations = ["firebase"]

[environments.staging.firebase]
android_app_id = "1:000000000000:android:0000000000000000"
ios_app_id = "1:000000000000:ios:0000000000000000"

# Commands that run only for this environment, after the global [prepare].
[environments.staging.prepare]
all = ["dart run flutter_launcher_icons -f flutter_launcher_icons-staging.yaml"]

# Stores: AAB to Play internal and IPA to TestFlight, numbered from the store.
[environments.production]
env_file = ".env.production"
defines = { APP_VARIANT = "production", APP_COMMIT = "{commit}" }
build_number = "store"
destinations = ["play", "testflight"]

[environments.production.prepare]
all = ["dart run flutter_launcher_icons -f flutter_launcher_icons-production.yaml"]
