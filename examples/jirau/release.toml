schema_version = 2

# Native apps generated by jirau (Rust core + Compose + SwiftUI).
# Gradle builds the Rust core in preBuild; for iOS mobile-release runs
# scripts/build-ios-ffi.sh and `xcodegen generate --spec ios/project.yml`.
[project]
type = "native"
preset = "jirau"

[app]
name = "secure-vault"

[android]
package_name = "com.example.vault"

[ios]
bundle_id = "com.example.vault"
# XcodeGen names the project and scheme after project.yml's `name`.
project = "ios/SecureVault.xcodeproj"
scheme = "SecureVault"

[environments.beta]
destinations = ["testflight", "artifacts"]

[environments.production]
build_number = "store"
destinations = ["play", "app-store"]
